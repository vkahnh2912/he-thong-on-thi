<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="woodBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3525"/>
      <stop offset="50%" stop-color="#735338"/>
      <stop offset="100%" stop-color="#3b2819"/>
    </linearGradient>
    <radialGradient id="boardGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2a3b3a"/>
      <stop offset="100%" stop-color="#141d1c"/>
    </radialGradient>
    <filter id="chalkTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Wooden Frame -->
  <rect x="0" y="0" width="400" height="240" rx="12" fill="url(#woodBorder)"/>
  
  <!-- Blackboard Surface -->
  <rect x="14" y="14" width="372" height="212" rx="6" fill="url(#boardGlow)"/>
  
  <!-- Tiny decorative flags / bunting on top of blackboard -->
  <g opacity="0.85">
    <polygon points="30,14 42,26 54,14" fill="#f59e0b"/>
    <polygon points="56,14 68,26 80,14" fill="#ef4444"/>
    <polygon points="82,14 94,26 106,14" fill="#3b82f6"/>
    <polygon points="108,14 120,26 132,14" fill="#10b981"/>
    <polygon points="134,14 146,26 158,14" fill="#ec4899"/>
    <polygon points="160,14 172,26 184,14" fill="#f59e0b"/>
    <polygon points="186,14 198,26 210,14" fill="#8b5cf6"/>
    <polygon points="212,14 224,26 236,14" fill="#ef4444"/>
    <polygon points="238,14 250,26 262,14" fill="#3b82f6"/>
    <polygon points="264,14 276,26 288,14" fill="#10b981"/>
    <polygon points="290,14 302,26 314,14" fill="#f59e0b"/>
    <polygon points="316,14 328,26 340,14" fill="#ec4899"/>
    <polygon points="342,14 354,26 366,14" fill="#3b82f6"/>
  </g>

  <!-- Chalk Text Content -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif">
    <text x="200" y="85" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="1.5" opacity="0.95">
      ĐẠI HỌC KINH DOANH &amp; CÔNG NGHỆ
    </text>
    <text x="200" y="105" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="2" opacity="0.95">
      HÀ NỘI
    </text>
    <line x1="100" y1="120" x2="300" y2="120" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.6"/>
    <text x="200" y="152" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))">
      KỸ NGHỆ PHẦN MỀM
    </text>
    <text x="200" y="180" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="3" opacity="0.8">
      NGÂN HÀNG CÂU HỎI TRẮC NGHIỆM
    </text>
  </g>
</svg>

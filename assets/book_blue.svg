<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="coolBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="240" rx="12" fill="url(#coolBg)"/>

  <!-- Logo Cap Icon in Top Center -->
  <g transform="translate(180, 24)">
    <circle cx="20" cy="20" r="18" fill="#818cf8" opacity="0.15"/>
    <path d="M7 18 L20 11 L33 18 L20 25 Z" fill="#6366f1"/>
    <path d="M12 21 V26 C12 29 28 29 28 26 V21" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="33" cy="24" r="2" fill="#f59e0b"/>
  </g>

  <!-- Open Book & Floating Papers -->
  <g transform="translate(70, 75)">
    <path d="M 130 135 C 75 135 15 130 5 125 C 2 124 0 120 0 115 L 0 50 C 30 55 90 60 130 60 C 170 60 230 55 260 50 L 260 115 C 260 120 258 124 255 125 C 245 130 185 135 130 135 Z" fill="#cbd5e1" opacity="0.4"/>
    <path d="M 130 125 C 75 125 20 118 10 112 L 10 38 C 25 44 80 52 130 52 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 130 125 C 185 125 240 118 250 112 L 250 38 C 235 44 180 52 130 52 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Page Lines -->
    <line x1="30" y1="58" x2="110" y2="60" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="30" y1="72" x2="115" y2="74" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="30" y1="86" x2="105" y2="88" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="145" y1="60" x2="230" y2="58" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="145" y1="74" x2="225" y2="72" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="145" y1="88" x2="230" y2="86" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Floating Paper Aeroplane / Notes -->
  <g transform="translate(280, 50) rotate(-15)">
    <polygon points="0,15 35,0 20,25" fill="#38bdf8" opacity="0.8"/>
  </g>
  <g transform="translate(60, 45) rotate(20)">
    <polygon points="0,0 25,8 15,22" fill="#818cf8" opacity="0.7"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="60%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="240" rx="12" fill="url(#skyGrad)"/>

  <!-- Logo Cap Icon in Top Center -->
  <g transform="translate(180, 24)">
    <circle cx="20" cy="20" r="18" fill="#818cf8" opacity="0.15"/>
    <path d="M7 18 L20 11 L33 18 L20 25 Z" fill="#6366f1"/>
    <path d="M12 21 V26 C12 29 28 29 28 26 V21" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="33" cy="24" r="2" fill="#f59e0b"/>
  </g>

  <!-- Big Open Book Illustration -->
  <g transform="translate(80, 75)">
    <!-- Book Shadow -->
    <path d="M 120 135 C 70 135 15 130 5 125 C 2 124 0 120 0 115 L 0 50 C 30 55 80 60 120 60 C 160 60 210 55 240 50 L 240 115 C 240 120 238 124 235 125 C 225 130 170 135 120 135 Z" fill="#cbd5e1" opacity="0.4"/>
    <!-- Left Pages -->
    <path d="M 120 125 C 70 125 20 118 10 112 L 10 38 C 25 44 70 52 120 52 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Right Pages -->
    <path d="M 120 125 C 170 125 220 118 230 112 L 230 38 C 215 44 170 52 120 52 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Page text lines (left) -->
    <line x1="30" y1="58" x2="100" y2="60" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="30" y1="72" x2="105" y2="74" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="30" y1="86" x2="95" y2="88" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="30" y1="100" x2="85" y2="101" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- Page text lines (right) -->
    <line x1="135" y1="60" x2="210" y2="58" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="135" y1="74" x2="205" y2="72" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="135" y1="88" x2="210" y2="86" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="135" y1="101" x2="190" y2="100" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Alarm Clock Left -->
  <g transform="translate(35, 125)">
    <circle cx="28" cy="30" r="22" fill="#fbbf24"/>
    <circle cx="28" cy="30" r="18" fill="#ffffff"/>
    <line x1="28" y1="30" x2="28" y2="19" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="30" x2="37" y2="30" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="28" cy="30" r="2.5" fill="#1e293b"/>
    <!-- Bells -->
    <path d="M 12 16 A 6 6 0 0 1 20 11" stroke="#d97706" stroke-width="3" fill="none"/>
    <path d="M 36 11 A 6 6 0 0 1 44 16" stroke="#d97706" stroke-width="3" fill="none"/>
    <!-- Feet -->
    <line x1="16" y1="48" x2="12" y2="54" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="48" x2="44" y2="54" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Yellow & Red Flowers Right -->
  <g transform="translate(325, 130)">
    <circle cx="20" cy="20" r="14" fill="#fb7185"/>
    <circle cx="20" cy="20" r="6" fill="#fef08a"/>
    <circle cx="45" cy="40" r="10" fill="#f59e0b"/>
    <circle cx="45" cy="40" r="4" fill="#ffffff"/>
  </g>

  <!-- Sun Rays & Leaves -->
  <path d="M 10 240 Q 30 190 70 200 Q 50 240 10 240 Z" fill="#86efac" opacity="0.8"/>
  <path d="M 320 240 Q 340 180 390 190 Q 380 240 320 240 Z" fill="#34d399" opacity="0.7"/>
</svg>
